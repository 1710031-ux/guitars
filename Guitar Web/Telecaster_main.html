<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fender Telecaster</title>
  <link rel="stylesheet" href="style.css">
  <style> /* D-28_main 스타일 기반 */
    body{ font-family:'Inter','Segoe UI','Apple SD Gothic Neo',Arial,sans-serif; background:#f4f6fa; margin:0; color:#222; }
  header{ background:#23395d; color:#fff; padding:32px 0 20px 0; text-align:center; }
  .detail-layout{ display:flex; gap:40px; padding:48px 20px; max-width:900px; margin:0 auto; }
  .detail-img{ background:#fff; padding:32px; border-radius:24px; }
  .detail-info{ background:#fff; padding:40px; border-radius:24px; }
  </style>
</head>
<body>
  <header>
    <h1>Fender Telecaster</h1>
    <button onclick="window.location.href='index.html'">뒤로가기</button>
  </header>
  <main class="detail-layout">
    <div class="detail-img">
  <img src="images/Telecaster.jpeg" alt="Fender Telecaster">
    </div>
    <div class="detail-info">
      <h2>Fender</h2>
      <p>심플한 디자인과 명확한 사운드.</p>
      <ul>
        <li>재질: 알더/애쉬 바디</li>
      </ul>
    </div>
  </main>
  <footer>
    <button id="like-btn">❤️ 좋아요</button>
    <button onclick="window.location.href='index.html'">다른 모델 보기</button>
  </footer>
  <script>document.getElementById('like-btn').addEventListener('click', function(){ this.classList.toggle('liked'); });</script>
</body>
</html>
