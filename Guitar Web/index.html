<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guitar Collection</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Inter', 'Segoe UI', 'Apple SD Gothic Neo', Arial, sans-serif;
      background: #f4f6fa;
      margin: 0;
      color: #222;
      min-height: 100vh;
    }
    header {
      background: #23395d;
      color: #fff;
      padding: 32px 0 24px 0;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
    }
    header h1 {
      margin: 0 0 18px 0;
      font-size: 2.4rem;
      letter-spacing: 1.5px;
      font-weight: 700;
    }
    nav {
      margin-bottom: 18px;
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand-btn {
      background: #e9ecf2;
      color: #23395d;
      border: none;
      border-radius: 16px;
      padding: 10px 28px;
      font-size: 1.05rem;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      transition: background 0.2s, color 0.2s;
    }
    .brand-btn.active,
    .brand-btn:hover {
      background: #dbe3ee;
      color: #1a2940;
    }
    #search {
      margin-top: 10px;
      padding: 12px 20px;
      border-radius: 16px;
      border: none;
      font-size: 1.05rem;
      width: 260px;
      max-width: 90vw;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      outline: none;
      transition: box-shadow 0.2s;
    }
    #search:focus {
      box-shadow: 0 2px 8px rgba(35,57,93,0.12);
    }
    main {
      padding: 40px 0 0 0;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 32px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px 60px 20px;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 2px 16px rgba(35,57,93,0.07);
      padding: 28px 22px 22px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: box-shadow 0.2s, transform 0.2s;
      cursor: pointer;
      min-height: 340px;
    }
    .card:hover {
      box-shadow: 0 6px 24px rgba(35,57,93,0.13);
      transform: translateY(-4px) scale(1.02);
    }
    .card img {
      width: 100%;
      max-width: 180px;
      height: auto;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 18px;
      object-fit: cover;
      background: #f4f6fa;
    }
    .card h3 {
      margin: 0 0 10px 0;
      font-size: 1.25rem;
      color: #23395d;
      font-weight: 600;
      text-align: center;
    }
    .card p {
      margin: 0;
      font-size: 1rem;
      color: #444;
      text-align: center;
      line-height: 1.5;
    }
    /* 모달 스타일 */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(35,57,93,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.2s;
    }
    .modal.hidden {
      display: none;
    }
    .modal-content {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(35,57,93,0.18);
      padding: 40px 32px 32px 32px;
      max-width: 380px;
      width: 90vw;
      text-align: center;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .modal-content img {
      width: 100%;
      max-width: 220px;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.10);
      margin-bottom: 16px;
      object-fit: cover;
      background: #f4f6fa;
    }
    .close-btn {
      position: absolute;
      top: 18px;
      right: 22px;
      font-size: 2rem;
      color: #23395d;
      cursor: pointer;
      font-weight: 700;
      transition: color 0.2s;
    }
    .close-btn:hover {
      color: #d7263d;
    }
    #modal-model {
      font-size: 1.3rem;
      color: #23395d;
      font-weight: 600;
      margin: 0 0 8px 0;
    }
    #modal-desc {
      font-size: 1.05rem;
      color: #444;
      margin: 0 0 12px 0;
      line-height: 1.5;
    }
    #modal-detail {
      display: inline-block;
      background: #e9ecf2;
      color: #23395d;
      border-radius: 14px;
      padding: 10px 24px;
      font-size: 1.05rem;
      font-weight: 500;
      text-decoration: none;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      transition: background 0.2s, color 0.2s;
      margin-top: 8px;
    }
    #modal-detail:hover {
      background: #dbe3ee;
      color: #1a2940;
    }
    @media (max-width: 700px) {
      header {
        padding: 20px 0 16px 0;
        border-bottom-left-radius: 16px;
        border-bottom-right-radius: 16px;
      }
      .gallery {
        grid-template-columns: 1fr;
        gap: 18px;
        padding: 0 6px 40px 6px;
      }
      .card {
        padding: 18px 8px 16px 8px;
        min-height: 220px;
      }
      .modal-content {
        padding: 18px 8px 18px 8px;
        max-width: 98vw;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Guitars</h1>
    <nav>
      <button class="brand-btn" data-brand="All">All</button>
      <button class="brand-btn" data-brand="Martin">Martin</button>
      <button class="brand-btn" data-brand="Gibson">Gibson</button>
      <button class="brand-btn" data-brand="Fender">Fender</button>
    </nav>
    <input type="text" id="search" placeholder="모델명 검색...">
  </header>
  <main>
    <div class="gallery">
      <!-- 카드 예시 (실제 데이터는 JS에서 생성) -->
    </div>
  </main>
  <!-- 모달 -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <img id="modal-img" src="" alt="기타 이미지">
      <h2 id="modal-model"></h2>
      <p id="modal-desc"></p>
      <a id="modal-detail" href="#">자세히 보기</a>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
