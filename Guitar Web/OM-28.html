<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Martin OM-28</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body{ font-family:'Segoe UI','Apple SD Gothic Neo',Arial,sans-serif; background:#f4f6fa; margin:0; color:#222; }
    header{ background:#23395d; color:#fff; padding:32px 0 20px 0; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,0.04); }
    header h1{ margin:0; font-size:2.4rem; }
    header button{ margin-top:12px; background:#e9ecf2; color:#23395d; border:none; border-radius:16px; padding:10px 28px; cursor:pointer; }
    .detail-layout{ display:flex; flex-wrap:wrap; justify-content:center; gap:40px; padding:48px 20px 32px 20px; max-width:900px; margin:0 auto; }
    .detail-img{ display:flex; align-items:center; justify-content:center; background:#fff; border-radius:24px; padding:32px 24px; }
    .detail-img img{ width:100%; max-width:320px; border-radius:18px; }
    .detail-info{ background:#fff; border-radius:24px; padding:40px 32px; min-width:260px; max-width:340px; }
    footer{ display:flex; justify-content:center; gap:20px; padding:36px 0 40px 0; }
  </style>
</head>
<body>
  <header>
    <h1>Martin OM-28</h1>
    <button onclick="window.location.href='index.html'">뒤로가기</button>
  </header>
  <main class="detail-layout">
    <div class="detail-img">
  <img src="images/OM-28.jpeg" alt="Martin OM-28">
    </div>
    <div class="detail-info">
      <h2>Martin</h2>
      <p>밸런스 좋은 사운드와 클래식한 디자인의 OM-28.</p>
      <ul>
        <li>재질: 스프루스 탑, 로즈우드 백&사이드</li>
        <li>사운드: 균형 잡힌 톤과 명확한 울림</li>
        <li>특징: 스트러밍과 핑거스타일 모두에 적합</li>
      </ul>
    </div>
  </main>
  <footer>
    <button id="like-btn">❤️ 좋아요</button>
    <button onclick="window.location.href='index.html'">다른 모델 보기</button>
  </footer>
  <script>document.getElementById('like-btn').addEventListener('click', function(){ this.classList.toggle('liked'); });</script>
</body>
</html>
