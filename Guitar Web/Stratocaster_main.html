<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fender Stratocaster</title>
  <link rel="stylesheet" href="style.css">
  <style> /* D-28_main 스타일 기반 */
    body { font-family: 'Inter', 'Segoe UI', 'Apple SD Gothic Neo', Arial, sans-serif; background: #f4f6fa; margin: 0; color: #222; }
    header { background: #23395d; color: #fff; padding: 32px 0 20px 0; text-align: center; }
    header h1 { margin:0; font-size:2.4rem; }
  header button{ margin-top:18px; background:#e9ecf2; color:#23395d; }
  .detail-layout{ display:flex; gap:40px; padding:48px 20px; max-width:900px; margin:0 auto; }
  .detail-img{ background:#fff; border-radius:24px; padding:32px; min-width:340px; }
  .detail-img img{ max-width:320px; border-radius:18px; }
  .detail-info{ background:#fff; border-radius:24px; padding:40px; }
  </style>
</head>
<body>
  <header>
    <h1>Fender Stratocaster</h1>
    <button onclick="window.location.href='index.html'">뒤로가기</button>
  </header>
  <main class="detail-layout">
    <div class="detail-img">
  <img src="images/Stratocaster.jpeg" alt="Fender Stratocaster">
    </div>
    <div class="detail-info">
      <h2>Fender</h2>
      <p>전설적인 일렉 기타, 다양한 장르에 어울립니다.</p>
      <ul>
        <li>재질: 알더/애쉬 바디</li>
        <li>사운드: 밝고 선명한 클린 톤</li>
      </ul>
    </div>
  </main>
  <footer>
    <button id="like-btn">❤️ 좋아요</button>
    <button onclick="window.location.href='index.html'">다른 모델 보기</button>
  </footer>
  <script>document.getElementById('like-btn').addEventListener('click', function(){ this.classList.toggle('liked'); });</script>
</body>
</html>
