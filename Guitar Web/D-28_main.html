<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Martin D-28</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Inter', 'Segoe UI', 'Apple SD Gothic Neo', Arial, sans-serif;
      background: #f4f6fa;
      margin: 0;
      color: #222;
      min-height: 100vh;
    }
    header {
      background: #23395d;
      color: #fff;
      padding: 32px 0 20px 0;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
    }
    header h1 {
      margin: 0;
      font-size: 2.4rem;
      letter-spacing: 1.5px;
      font-weight: 700;
    }
    header button {
      margin-top: 18px;
      background: #e9ecf2;
      color: #23395d;
      border: none;
      border-radius: 16px;
      padding: 10px 28px;
      font-size: 1.05rem;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      transition: background 0.2s, color 0.2s;
    }
    header button:hover {
      background: #dbe3ee;
      color: #1a2940;
    }
    .detail-layout {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 40px;
      padding: 48px 20px 32px 20px;
      max-width: 900px;
      margin: 0 auto;
    }
    .detail-img {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 4px 32px rgba(35,57,93,0.08);
      padding: 32px 24px;
      min-width: 340px;
      max-width: 380px;
    }
    .detail-img img {
      width: 100%;
      max-width: 320px;
      height: auto;
      border-radius: 18px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      border: none;
      background: #fff;
      object-fit: cover;
    }
    .detail-info {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 2px 16px rgba(35,57,93,0.07);
      padding: 40px 32px;
      min-width: 260px;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .detail-info h2 {
      margin: 0;
      font-size: 1.7rem;
      color: #23395d;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .detail-info p {
      font-size: 1.13rem;
      margin: 0;
      color: #444;
      line-height: 1.6;
    }
    .detail-info ul {
      padding-left: 18px;
      margin: 0;
      color: #555;
      font-size: 1.02rem;
      line-height: 1.7;
    }
    .detail-info li {
      margin-bottom: 7px;
    }
    footer {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 36px 0 40px 0;
      background: transparent;
    }
    #like-btn {
      background: #e9ecf2;
      color: #d7263d;
      border: none;
      border-radius: 16px;
      padding: 12px 32px;
      font-size: 1.13rem;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 1px 6px rgba(215,38,61,0.08);
      transition: background 0.2s, color 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #like-btn.liked {
      background: #d7263d;
      color: #fff;
    }
    footer button {
      background: #e9ecf2;
      color: #23395d;
      border: none;
      border-radius: 16px;
      padding: 12px 32px;
      font-size: 1.13rem;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
      transition: background 0.2s, color 0.2s;
    }
    footer button:hover {
      background: #dbe3ee;
      color: #1a2940;
    }
    @media (max-width: 700px) {
      .detail-layout {
        flex-direction: column;
        align-items: center;
        gap: 24px;
        padding: 24px 8px 8px 8px;
      }
      .detail-info {
        padding: 24px 12px;
        min-width: unset;
        max-width: 98vw;
      }
      .detail-img {
        min-width: unset;
        max-width: 98vw;
        padding: 18px 8px;
      }
      .detail-img img {
        max-width: 98vw;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Martin D-28</h1>
    <button onclick="window.location.href='index.html'">뒤로가기</button>
  </header>
  <main class="detail-layout">
    <div class="detail-img">
      <img src="images/common.jpeg" alt="Martin D-28">
    </div>
    <div class="detail-info">
      <h2>Martin</h2>
      <p>전설적인 D-28 모델은 깊은 울림과 선명한 사운드로 유명합니다.</p>
      <ul>
        <li>재질: 스프루스 탑, 로즈우드 백&사이드</li>
        <li>사운드: 풍부하고 따뜻함</li>
        <li>특징: 포크/컨트리/록에 적합</li>
      </ul>
    </div>
  </main>
  <footer>
    <button id="like-btn">❤️ 좋아요</button>
    <button onclick="window.location.href='index.html'">다른 모델 보기</button>
  </footer>
  <script>
    document.getElementById('like-btn').addEventListener('click', function() {
      this.classList.toggle('liked');
    });
  </script>
</body>
</html>
